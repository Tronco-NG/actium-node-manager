[package]
name = "actium-node-supervisor"
version = "0.5.21"
description = "Supervisor de ciclo de vida del nodo Actium"
authors = ["Actium"]
edition = "2021"

[features]
default = []
fault-injection = ["actium-node-core/fault-injection"]

[dependencies]
actium-node-core = { path = "../actium-node-core" }
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
interprocess = "=2.4.3"
widestring = "1"
windows-service = "=0.8.1"
