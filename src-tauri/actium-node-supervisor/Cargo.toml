[package]
name = "actium-node-supervisor"
version = "0.5.8"
description = "Servicio privilegiado Linux y Windows para Actium Node Manager"
authors = ["Actium"]
edition = "2021"

[dependencies]
actium-node-core = { path = "../actium-node-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
interprocess = "=2.4.3"
widestring = "1"
windows-service = "=0.8.1"
