[package]
name = "actium-node-core"
version = "0.1.0"
description = "Core transaccional y durable de Actium Node Manager"
authors = ["Actium"]
edition = "2021"

[dependencies]
fs2 = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
