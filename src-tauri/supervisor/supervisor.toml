product_channel = "stable"
socket_path = "/run/actium/node-manager.sock"
pipe_name = "ActiumNodeSupervisor"
service_name = "actium-node-supervisor"
ipc_key_path = "/etc/actium/node-manager/ipc.key"
journal_path = "/var/lib/actium/node-manager/operations.sqlite3"
host_identity_root = "/var/lib/actium/node-manager/identity"
authorized_nodes_root = "/actium/nodes"
authorized_fabrics_root = "/actium/fabrics"
# Optional external Product Extension Bundle. The Base Runtime starts without it.
payload_root = "/usr/lib/actium/node-manager/payload"
extensions_root = "/var/lib/actium/node-manager/extensions"
extension_trust_root = "/var/lib/actium/node-manager/extension-trust"
log_dir = "/var/log/actium/node-manager"
fabric_identity_path = "/var/lib/actium/node-manager/fabric-identity.json"
fabric_id = "auto"
fabric_project = "actium-node-fabric-01"
fabric_network = "actium-node-fabric-01"
operator_group = "actium-node-operators"
network_reconcile_interval_seconds = 15
runtime_reconcile_interval_seconds = 10
runtime_reconcile_max_parallel_nodes = 4
root_ownership_marker = "/var/lib/actium/node-manager/root-ownership.json"
