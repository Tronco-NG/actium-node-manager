[package]
name = "actium-node-core"
version = "0.3.0"
description = "Core transaccional y durable de Actium Node Manager"
authors = ["Actium"]
edition = "2021"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
hmac = "0.12"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "user"] }
