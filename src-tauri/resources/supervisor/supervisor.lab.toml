product_channel = "lab"
socket_path = "/run/actium/node-manager-lab.sock"
pipe_name = "ActiumNodeSupervisorLab"
service_name = "actium-node-supervisor-lab"
ipc_key_path = "/etc/actium/node-manager-lab/ipc.key"
journal_path = "/var/lib/actium/node-manager-lab/operations.sqlite3"
authorized_nodes_root = "/actium-lab/nodes"
authorized_fabrics_root = "/actium-lab/fabrics"
payload_root = "/usr/lib/actium/node-manager-lab/payload"
log_dir = "/var/log/actium/node-manager-lab"
fabric_identity_path = "/var/lib/actium/node-manager-lab/fabric-identity.json"
fabric_id = "auto"
fabric_project = "actium-lab-fabric-01"
fabric_network = "actium-lab-fabric-01"
operator_group = "actium-node-operators"
network_reconcile_interval_seconds = 15
runtime_reconcile_interval_seconds = 10
runtime_reconcile_max_parallel_nodes = 4
root_ownership_marker = "/var/lib/actium/node-manager-lab/root-ownership.json"
