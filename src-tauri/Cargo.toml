[package]
name = "actium-node-manager"
version = "0.7.0-rc.3"
description = "Aplicacion de administracion de nodos Actium"
authors = ["Actium"]
edition = "2021"

[workspace]
members = ["actium-node-core", "actium-node-supervisor"]
resolver = "2"

[lib]
name = "actium_node_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
actium-node-core = { path = "actium-node-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonwebtoken = "9.3"
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rfd = "0.15"
tauri = { version = "2.11.0", features = [] }
uuid = { version = "1", features = ["v4"] }
