[package]
name = "actium-authority-service"
version = "0.1.0"
description = "Servicio soberano de firmas y Trust Fabric de Actium"
authors = ["Actium"]
edition = "2021"

[[bin]]
name = "actium-authority-ceremony"
path = "src/bin/authority-ceremony.rs"

[[bin]]
name = "actium-authority-rebuild-trust-bundle"
path = "src/bin/authority-rebuild-trust-bundle.rs"

[dependencies]
actium-node-core = { path = "../actium-node-core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
