[package]
name = "actium-node-core"
version = "0.5.24"
description = "Core transaccional y durable de Actium Node Manager"
authors = ["Actium"]
edition = "2021"
build = "build.rs"

[features]
default = []
fault-injection = []

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
hmac = "0.12"
jsonschema = { version = "0.58.0", default-features = false }
rand = "0.8"
regex = "1"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
uuid = { version = "1", features = ["v4", "v5"] }
zeroize = "1.9"

[dev-dependencies]
rcgen = "0.13"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "user", "dir"] }

[target.'cfg(windows)'.dependencies]
interprocess = "=2.4.3"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
