[package]
name = "actium-node-supervisor"
version = "0.3.0"
description = "Servicio privilegiado Linux para Actium Node Manager"
authors = ["Actium"]
edition = "2021"

[dependencies]
actium-node-core = { path = "../actium-node-core" }
nix = { version = "0.29", features = ["fs", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
