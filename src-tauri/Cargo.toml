[package]
name = "actium-telemetry-node-installer"
version = "0.6.6"
description = "Instalador y administrador de nodos locales Actium Telemetry Data Plane"
authors = ["Actium"]
edition = "2021"

[workspace]
members = ["actium-node-core"]
resolver = "2"

[lib]
name = "actium_telemetry_node_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
actium-node-core = { path = "actium-node-core" }
jsonwebtoken = "9.3"
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = [] }
uuid = { version = "1", features = ["v4"] }
